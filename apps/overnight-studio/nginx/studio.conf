# Overnight Studio — dedicated vhost for studio.johnwatkinscodes.work.
# Reached via the cloudflared "box" tunnel (ingress: studio.johnwatkinscodes.work
# -> http://127.0.0.1:80). HTTPS is terminated at Cloudflare with the existing
# one-level *.johnwatkinscodes.work Universal SSL cert.
#
#   /              -> gallery (/srv/studio/gallery)
#   /s/<slug>/     -> a build (/srv/studio/sites/<slug>)
#   /api/...       -> vote service (127.0.0.1:8377)
#
# NOTE: this uses `listen 80` (not default_server). The main server in
# nginx.conf MUST be marked `listen 80 default_server` so this block only ever
# serves its own hostname and never hijacks the default (digest docroot).
server {
    listen 80;
    server_name studio.johnwatkinscodes.work;

    access_log /var/log/nginx/studio.access.log;
    error_log  /var/log/nginx/studio.error.log;

    root /srv/studio/gallery;
    index index.html;
    client_max_body_size 8k;

    location /api/ {
        proxy_pass http://127.0.0.1:8377;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    location /s/ {
        alias /srv/studio/sites/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
