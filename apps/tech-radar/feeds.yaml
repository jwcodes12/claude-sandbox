settings:
  title: Tech Digest
  description: A rolling digest of the tech discourse. Stories update in place as new posts, takes, and papers land.
  lookbackHours: 96
  maxItemsPerFeed: 40
  maxTopics: 24
  maxTopicItems: 14
  # The digest page shows the hottest frontPageStories stories that moved in
  # the last frontPageHours, with a compact "Earlier" list back to
  # earlierHours. Stories are deleted entirely after storyRetentionDays.
  frontPageHours: 48
  frontPageStories: 12
  earlierHours: 168
  storyRetentionDays: 14
  schedule:
    timezone: America/New_York
    peakStartHour: 8
    peakEndHour: 23
    offPeakMinimumMinutes: 60
  ranking:
    clusterSimilarity: 0.22
    # Minimum keyword similarity for folding a run's cluster into an existing
    # story when they share no literal items.
    storyMatchSimilarity: 0.3
    minHotnessForBrief: 24
    minItemsForBrief: 2
    maxModelBriefs: ${TECH_RADAR_MAX_MODEL_BRIEFS:-12}
  models:
    # Briefs are optional; deterministic fallbacks work without any model.
    # Default pipeline: Codex writes from the source bundle, Claude edits the
    # draft. Both shell out to logged-in local CLIs, so no API key is needed.
    # HTTP API providers still work via writerProvider/editorProvider:
    # anthropic or openai.
    enabled: ${TECH_RADAR_ENABLE_LLM:-false}
    provider: ${TECH_RADAR_MODEL_PROVIDER:-}
    writerProvider: ${TECH_RADAR_WRITER_PROVIDER:-codex}
    editorProvider: ${TECH_RADAR_EDITOR_PROVIDER:-claude}
    enableEditor: ${TECH_RADAR_ENABLE_EDITOR:-true}
    smallModel: ${TECH_RADAR_SMALL_MODEL:-claude-haiku-4-5}
    largeModel: ${TECH_RADAR_LARGE_MODEL:-claude-opus-4-8}
    codexModel: ${TECH_RADAR_CODEX_MODEL:-gpt-5.5}
    claudeModel: ${TECH_RADAR_CLAUDE_MODEL:-claude-opus-4-8}
    claudeFallbackModel: ${TECH_RADAR_CLAUDE_FALLBACK_MODEL:-claude-sonnet-4-6}
    agyWriterModel: ${TECH_RADAR_AGY_WRITER_MODEL:-Gemini 3.5 Flash (Medium)}
    agyEditorModel: ${TECH_RADAR_AGY_EDITOR_MODEL:-Gemini 3.5 Flash (High)}
    cliModel: ${TECH_RADAR_CLI_MODEL:-}
  newsboat:
    # Read tweets straight from the local newsboat sqlite cache.
    # Empty -> NEWSBOAT_CACHE_DB env, then ~/.newsboat/cache.db.
    cacheDb: ${NEWSBOAT_CACHE_DB:-}
  deploy:
    provider: ${TECH_RADAR_DEPLOY_PROVIDER:-netlify}

sources:
  # Tech Twitter, ingested directly from newsboat's cache.db (the curated "Tech"
  # list feed plus all individually-followed accounts). This supersedes the old
  # TWITTER_TECH_LIST_RSS / TWITTER_AI_WATCH_RSS HTTP bridges: newsboat already
  # polls these feeds, so no bridge URLs or extra env vars are required. Set
  # TECH_RADAR_TWITTER=false to disable.
  - id: twitter-watchlist
    title: Tech Twitter
    kind: twitter
    enabled: ${TECH_RADAR_TWITTER:-true}
    weight: 2.2
    tags: [twitter, ai, takes]
    newsboat:
      match: 'xcancel\.com/'
      maxItems: 250

  - id: hacker-news
    title: Hacker News
    kind: community
    url: https://news.ycombinator.com/rss
    enabled: true
    weight: 1.2
    tags: [tech, startups, developer]

