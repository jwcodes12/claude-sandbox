settings:
  title: Tech Radar
  description: Rolling clustered briefings from tech Twitter, blogs, research feeds, and developer news.
  lookbackHours: 96
  maxItemsPerFeed: 40
  maxTopics: 24
  maxTopicItems: 14
  schedule:
    timezone: America/New_York
    peakStartHour: 8
    peakEndHour: 23
    offPeakMinimumMinutes: 60
  ranking:
    clusterSimilarity: 0.22
    minHotnessForBrief: 24
    minItemsForBrief: 2
  models:
    enabled: ${TECH_RADAR_ENABLE_LLM:-false}
    provider: ${TECH_RADAR_MODEL_PROVIDER:-anthropic}
    smallModel: ${TECH_RADAR_SMALL_MODEL:-claude-3-5-haiku-latest}
    largeModel: ${TECH_RADAR_LARGE_MODEL:-claude-opus-4-1}
  deploy:
    provider: ${TECH_RADAR_DEPLOY_PROVIDER:-netlify}

sources:
  - id: twitter-tech-list
    title: My Twitter Tech List
    kind: twitter-list
    url: ${TWITTER_TECH_LIST_RSS:-}
    enabled: false
    weight: 2.4
    tags: [twitter, takes, personal]

  - id: twitter-ai-watch
    title: AI Watch Accounts
    kind: twitter-accounts
    url: ${TWITTER_AI_WATCH_RSS:-}
    enabled: false
    weight: 2.0
    tags: [twitter, ai, takes]

  - id: hacker-news
    title: Hacker News
    kind: community
    url: https://news.ycombinator.com/rss
    enabled: true
    weight: 1.2
    tags: [tech, startups, developer]

  - id: lobsters
    title: Lobsters
    kind: community
    url: https://lobste.rs/rss
    enabled: true
    weight: 1.0
    tags: [developer, programming]

  - id: arxiv-ai
    title: arXiv AI and ML
    kind: research
    url: https://rss.arxiv.org/rss/cs.AI+cs.LG+cs.CL+cs.SE
    enabled: true
    weight: 1.35
    tags: [ai, research, papers]

  - id: github-blog
