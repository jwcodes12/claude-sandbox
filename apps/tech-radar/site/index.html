<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tech Radar</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Rolling briefings</p>
          <h1>Tech Radar</h1>
        </div>
        <div class="status">
          <span class="dot"></span>
          <span id="generated-at">Loading</span>
        </div>
      </header>

      <section class="layout">
        <aside class="rail" aria-label="Topics">
          <div class="lane-tabs" id="lane-tabs" aria-label="Topic lanes"></div>
          <div class="topic-list" id="topic-list"></div>
        </aside>
        <article class="article" id="article">
          <p class="empty">Loading topics...</p>
        </article>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
